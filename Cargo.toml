[package]
name = "daemon"
version = "1.0.0"
edition = "2021"
description = "DAEMON: a 2050-style holographic terminal and system monitor written in Rust"
license = "GPL-3.0"
repository = "https://github.com/fcopensource/daemon"

[dependencies]
eframe = "0.29"        # native window + immediate-mode GUI (egui)
sysinfo = "0.30"       # CPU / memory / processes / network / disks
portable-pty = "0.8"   # cross-platform PTY (ConPTY on Windows)
vt100 = "0.15"         # terminal escape-sequence parser / screen model
chrono = "0.4"         # clock
# Audio output; decoders (pure Rust) for user-supplied custom sounds.
rodio = { version = "0.19", default-features = false, features = ["wav", "vorbis", "flac", "symphonia-mp3"] }
image = { version = "0.25", default-features = false, features = ["png"] }  # decode the app icon
ureq = { version = "2", features = ["json"] }  # HTTPS client for the Claude API
serde_json = "1"
nokhwa = { version = "0.10", features = ["input-native"] }  # webcam capture (Media Foundation / AVFoundation / V4L2)

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"    # embed the icon into daemon.exe

# `cargo bundle --release` builds DAEMON.app on macOS (see RUNNING_ON_MAC.md).
[package.metadata.bundle]
name = "DAEMON"
identifier = "com.fcopensource.daemon"
icon = ["assets/icon.png"]
resources = ["sounds"]
category = "public.app-category.developer-tools"
short_description = "2050-style holographic terminal and system monitor"
osx_minimum_system_version = "11.0"
osx_info_plist_exts = ["assets/Info.camera.plist"]  # camera permission prompt text

[profile.release]
opt-level = 3
lto = "thin"
